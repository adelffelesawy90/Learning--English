<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الإنجليزية: 10 مستويات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF4FB;--paper:#FFFFFF;--paper2:#F4F9FD;--ink:#13315C;--text:#1B2A40;--muted:#56687F;--line:#D2E2EF;
  --sun:#FFC23C;--coral:#F2545B;--mint:#1FA88A;--ok:#138A69;--bad:#D23A43;--okbg:#DDF5EC;--badbg:#FDE3E4;
  --disp:"Baloo Bhaijaan 2","Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  --body:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1828;--paper:#14253A;--paper2:#192D46;--ink:#A8CFF4;--text:#E8EFF8;--muted:#9EB1C9;--line:#26405C;
  --ok:#43D1A5;--bad:#FF7F85;--okbg:#113A30;--badbg:#44202A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1828;--paper:#14253A;--paper2:#192D46;--ink:#A8CFF4;--text:#E8EFF8;--muted:#9EB1C9;--line:#26405C;
  --ok:#43D1A5;--bad:#FF7F85;--okbg:#113A30;--badbg:#44202A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:10px}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--disp)}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 120px}
h1,h2,h3{font-family:var(--disp);line-height:1.25;margin:0;color:var(--ink)}
p{margin:0}
.muted{color:var(--muted)}

/* air-mail stripe: the only decoration on the chrome */
.airmail{height:7px;background:repeating-linear-gradient(-45deg,var(--coral) 0 12px,transparent 12px 20px,#3B8FD9 20px 32px,transparent 32px 40px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:800;font-size:1.15rem;color:var(--ink)}
.brand i{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:1rem}
.icons{display:flex;gap:8px}
.ibtn{border:2px solid var(--line);background:var(--paper);border-radius:12px;height:42px;min-width:42px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
.ibtn:hover{border-color:var(--ink)}

/* buttons */
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:800;font-family:var(--disp);font-size:1.05rem;background:var(--ink);color:var(--bg);box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.sun{background:var(--sun);color:#3a2a00}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* hero / mission */
.hello{font-family:var(--disp);font-weight:700;color:var(--muted);font-size:1.05rem}
.hero h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;margin:2px 0 16px}
.mission{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;position:relative;overflow:hidden}
.mission::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:8px;background:var(--lv)}
.mbadge{width:74px;height:74px;border-radius:50%;background:var(--lv);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:1.6rem;margin-inline-start:6px}
.mission h2{font-size:1.35rem}
.mission .sub{color:var(--muted);margin:4px 0 12px}
.steps3{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.steps3 span{font-size:.85rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--paper2);border:1.5px solid var(--line);color:var(--muted)}
.steps3 span.on{background:var(--lv);border-color:var(--lv);color:#fff}
.steps3 span.done{color:var(--ok);border-color:var(--ok)}
@media (max-width:560px){.mission{grid-template-columns:1fr}.mbadge{width:58px;height:58px;font-size:1.25rem}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 30px}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 12px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:1.5rem;color:var(--ink);line-height:1.2}
.stat small{color:var(--muted);font-weight:700;font-size:.82rem}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}

/* THE MAP: the one bold element */
.map{position:relative;padding-bottom:20px}
.map>h2{font-size:1.5rem;margin:0 0 4px}
.map>.muted{margin-bottom:10px}
.trail{position:absolute;inset:0;width:100%;pointer-events:none;overflow:visible}
.trail .base{fill:none;stroke:var(--line);stroke-width:6;stroke-dasharray:2 14;stroke-linecap:round}
.trail .prog{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;opacity:.85}
.region{position:relative;z-index:1;margin-top:18px}
.rhead{position:relative;z-index:2;display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:10px 14px}
.rhead .code{font-family:var(--disp);font-weight:800;font-size:1.3rem;color:#fff;background:var(--lv);border-radius:12px;padding:2px 12px;direction:ltr}
.rhead h3{font-size:1.1rem}
.rhead p{font-size:.9rem;color:var(--muted)}
.rhead .cnt{margin-inline-start:auto;font-weight:800;color:var(--ink);white-space:nowrap}
.rhead .cert-btn{margin-inline-start:8px}
.stops{direction:ltr;padding:10px 0 4px}
.stop{display:block;position:relative;width:150px;margin:6px 0 6px calc(var(--x) * 1% - 75px);background:none;border:0;padding:0;text-align:center}
.dot{position:relative;display:grid;place-items:center;margin:0 auto;width:76px;height:76px;border-radius:50%;font-family:var(--disp);font-weight:800;font-size:1.5rem;background:var(--paper);border:4px solid var(--line);color:var(--muted);z-index:1}
.lbl{display:block;direction:rtl;font-weight:700;font-size:.9rem;line-height:1.35;margin-top:6px;color:var(--text)}
.s-lock .dot{opacity:.75}
.s-lock .lbl{color:var(--muted)}
.s-cur .dot{background:var(--lv);border-color:var(--paper);color:#fff;box-shadow:0 0 0 4px var(--lv)}
.s-cur .dot::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--lv);opacity:.5;animation:ring 2.2s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:.6}to{transform:scale(1.25);opacity:0}}
.s-cur .tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:2;background:var(--sun);color:#3a2a00;font-weight:800;font-size:.75rem;padding:1px 10px;border-radius:99px;white-space:nowrap}
.s-done .dot{border-color:var(--lv);color:var(--lv);background:var(--paper)}
.stamp{position:absolute;inset:-6px;border-radius:50%;border:3px double var(--lv);color:var(--lv);display:grid;place-items:center;transform:rotate(-14deg);font-family:var(--disp);background:color-mix(in srgb,var(--lv) 12%,var(--paper))}
.stamp b{font-size:1.15rem;line-height:1}
.stamp small{display:block;font-size:.62rem;font-weight:700;letter-spacing:.02em;line-height:1.2}
.stop:hover .dot{transform:translateY(-2px)}
.dot{transition:transform .15s}

/* lesson */
.lhead{background:var(--lv);color:#fff;border-radius:24px;padding:22px;margin-top:4px;position:relative;overflow:hidden}
.lhead .back{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:4px 12px;font-weight:700}
.lhead .meta{margin-top:12px;font-weight:700;opacity:.9}
.lhead h1{color:#fff;font-size:clamp(1.7rem,5vw,2.4rem);margin-top:2px}
.lhead .ar{font-size:1.1rem;font-weight:700;opacity:.95}
.tabs{display:flex;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:5px;margin:16px 0}
.tabs button{flex:1;border:0;background:none;border-radius:11px;padding:9px 6px;font-weight:800;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.hint{color:var(--muted);font-size:.95rem;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.fc{perspective:900px;height:170px;cursor:pointer;outline:none}
.fc-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:2px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center}
.face.front b{font-family:var(--disp);font-size:1.45rem;color:var(--ink);direction:ltr}
.face.back{transform:rotateY(180deg);background:var(--paper2);border-color:var(--lv)}
.face.back b{font-size:1.2rem;color:var(--text)}
.face.back .en{font-size:.92rem;color:var(--muted);margin-top:6px;line-height:1.4}
.say{border:2px solid var(--line);background:var(--paper2);border-radius:99px;width:38px;height:38px;display:inline-grid;place-items:center;font-size:1rem;margin-top:8px}
.say:hover{border-color:var(--ink)}
.gcard{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:20px}
.gcard h3{font-size:1.25rem;direction:ltr;text-align:left;margin-bottom:10px}
.gcard .exp{line-height:2}
.gcard .exp b{color:var(--ink)}
.exs{margin-top:16px;display:grid;gap:10px}
.ex{display:flex;align-items:center;gap:12px;background:var(--paper2);border-radius:14px;padding:10px 12px;border-inline-start:5px solid var(--lv)}
.ex .say{margin:0;flex:none}
.ex .en{font-size:1.1rem;font-weight:700;display:block;text-align:left}
.ex small{color:var(--muted);display:block}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.actionbar .inner{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.actionbar p{font-weight:700;color:var(--muted);font-size:.95rem}

/* tutor */
.tutor{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:2px solid var(--line);background:var(--paper2);border-radius:99px;padding:5px 14px;font-weight:700;font-size:.9rem}
.chip:hover{border-color:var(--ink)}
.msgs{display:grid;gap:10px;margin:10px 0}
.msg{padding:10px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.8}
.msg.me{background:var(--ink);color:var(--bg);justify-self:start;max-width:85%}
.msg.ai{background:var(--paper2);border:2px solid var(--line)}
.ask{display:flex;gap:8px}
.ask textarea{flex:1;border:2px solid var(--line);background:var(--paper2);border-radius:14px;padding:10px;resize:vertical;min-height:52px}

/* test */
.test{padding-top:14px}
.tbar{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:14px;background:var(--paper);border:2px solid var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .3s}
.tkind{font-family:var(--disp);font-weight:800;color:var(--ink);margin:18px 0 6px;font-size:1.05rem}
.qcard{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:22px}
.qtag{display:inline-block;font-weight:800;font-size:.8rem;padding:2px 12px;border-radius:99px;background:var(--paper2);border:1.5px solid var(--line);color:var(--muted);margin-bottom:10px}
.qtext{font-size:1.35rem;font-weight:700;line-height:1.6}
.qtext.en{display:block;text-align:left;font-size:1.45rem}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--sun);margin:0 4px;vertical-align:-4px}
.bigsay{display:flex;justify-content:center;margin:18px 0 4px}
.bigsay button{width:96px;height:96px;border-radius:50%;border:0;background:var(--sun);font-size:2.2rem;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{border:2px solid var(--line);background:var(--paper2);border-radius:16px;padding:13px 16px;font-weight:700;font-size:1.08rem;text-align:start;display:flex;gap:10px;align-items:center}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);font-size:.85rem;color:var(--muted)}
.opt.en-opt{direction:ltr;text-align:left;font-family:var(--disp)}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.spell{display:flex;gap:10px;margin-top:18px}
.spell input{flex:1;direction:ltr;text-align:left;font-family:var(--disp);font-size:1.3rem;border:2px solid var(--line);background:var(--paper2);border-radius:14px;padding:10px 14px}
.spell input.right{border-color:var(--ok);background:var(--okbg)}
.spell input.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;font-weight:600;line-height:1.8}
.fb.good{background:var(--okbg);color:var(--text);border:2px solid var(--ok)}
.fb.bad{background:var(--badbg);color:var(--text);border:2px solid var(--bad)}
.fb strong{font-family:var(--disp);font-size:1.15rem;display:block}
.next{margin-top:14px;display:flex;justify-content:flex-end}

/* result */
.result{text-align:center;padding-top:20px}
.score{position:relative;width:190px;height:190px;margin:10px auto}
.score svg{width:100%;height:100%;transform:rotate(-90deg)}
.score b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:2.6rem;color:var(--ink)}
.result h2{font-size:1.7rem;margin-top:8px}
.result>p{color:var(--muted);max-width:520px;margin:8px auto 18px}
.bigstamp{width:170px;height:170px;margin:6px auto 0;border-radius:50%;border:5px double var(--lv);color:var(--lv);display:grid;place-items:center;text-align:center;font-family:var(--disp);background:color-mix(in srgb,var(--lv) 10%,var(--paper));transform:rotate(-12deg);animation:slam .7s cubic-bezier(.2,1.6,.4,1) both .25s}
.bigstamp b{font-size:2.2rem;line-height:1}
.bigstamp small{display:block;font-weight:700;font-size:.8rem}
@keyframes slam{from{transform:scale(2.4) rotate(8deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
.wrongs{text-align:start;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px;margin:18px 0}
.wrongs h3{font-size:1.1rem;margin-bottom:8px}
.wi{padding:10px 0;border-top:1.5px dashed var(--line)}
.wi:first-of-type{border-top:0}
.wi .ans{color:var(--ok);font-weight:800}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,18,32,.55);display:grid;place-items:center;padding:18px;overflow:auto}
.sheet{background:var(--paper);border-radius:24px;padding:22px;max-width:520px;width:100%;border:2px solid var(--line)}
.sheet h2{font-size:1.4rem;margin-bottom:12px}
.field{display:grid;gap:6px;margin:12px 0}
.field input,.field textarea{border:2px solid var(--line);background:var(--paper2);border-radius:12px;padding:10px 12px}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-weight:600}
.check input{width:20px;height:20px;margin-top:5px;flex:none}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--line);background:var(--paper2);border-radius:10px;padding:8px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
hr{border:0;border-top:2px dashed var(--line);margin:16px 0}

/* certificate */
.cert{background:#FFFDF7;color:#1B2A40;border-radius:8px;padding:34px 28px;text-align:center;border:10px solid var(--lv);outline:2px solid var(--lv);outline-offset:-18px;max-width:640px;width:100%}
.cert .lvc{font-family:var(--disp);font-weight:800;font-size:3.4rem;color:var(--lv);line-height:1;direction:ltr}
.cert h2{color:#13315C;font-size:1.8rem;margin:8px 0}
.cert .nm{font-family:var(--disp);font-size:2.2rem;font-weight:800;color:#13315C;border-bottom:2px dashed #b9c6d6;display:inline-block;padding:0 20px;margin:8px 0 12px}
.cert p{color:#44546b}

/* welcome */
.welcome{padding-top:6vh;max-width:620px;margin:0 auto}
.welcome h1{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:800}
.welcome .lead{font-size:1.15rem;color:var(--muted);margin:10px 0 24px}
.levels-strip{display:flex;gap:6px;margin:0 0 24px;direction:ltr}
.levels-strip span{flex:1;text-align:center;color:#fff;font-family:var(--disp);font-weight:800;padding:8px 0;border-radius:10px}
.flow{counter-reset:s;display:grid;gap:10px;margin:0 0 26px;padding:0;list-style:none}
.flow li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.flow li::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--disp);font-weight:800}
.nameform{display:flex;gap:10px;flex-wrap:wrap}
.nameform input{flex:1;min-width:200px;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;font-size:1.1rem}

.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;padding:10px 18px;border-radius:14px;z-index:60;max-width:90vw;text-align:center}
.empty{text-align:center;padding:30px;color:var(--muted)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body *{visibility:hidden}
  .cert,.cert *{visibility:visible}
  .cert{position:absolute;inset:0;margin:auto;height:fit-content}
  .modal{background:none}
}

/* ---- lesson stepper ---- */
.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:16px 0 14px}
.stepper button{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 4px;font-weight:800;font-size:.8rem;line-height:1.3;color:var(--muted);text-align:center}
.stepper .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paper2);border:2px solid var(--line);font-family:var(--disp);font-size:.95rem}
.stepper .done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper .now .n{background:var(--lv);border-color:var(--lv);color:#fff}
.stepper [aria-current="step"]{border-color:var(--lv);color:var(--ink);background:color-mix(in srgb,var(--lv) 10%,var(--paper))}
.stepper .lock{opacity:.5}
@media (max-width:560px){.stepper{grid-template-columns:repeat(3,1fr)}}
.ptitle{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.ptitle h2{font-size:1.3rem}
.ptitle span{color:var(--muted);font-weight:700;font-size:.9rem}
.info{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px;line-height:1.9}
.info ul{margin:8px 0 0;padding-inline-start:22px}

/* ---- dialogue ---- */
.dlg{display:grid;gap:10px;margin-top:12px}
.line{display:flex;gap:10px;align-items:flex-start;max-width:92%}
.line.b{margin-inline-start:auto;flex-direction:row-reverse}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:800;color:#fff}
.bub{background:var(--paper2);border:2px solid var(--line);border-radius:16px;padding:8px 12px;transition:background .2s,border-color .2s}
.bub .en{display:block;text-align:left;font-weight:700;font-size:1.08rem}
.bub small{color:var(--muted);display:block}
.hide-tr .bub small{display:none}
.line.playing .bub{border-color:var(--lv);background:color-mix(in srgb,var(--lv) 14%,var(--paper))}
.bub .row{gap:6px;margin-top:4px}
.bub .say,.ex .say{width:34px;height:34px;margin:0;font-size:.9rem}
.ex .sb{display:flex;gap:6px;flex:none}

/* ---- activities ---- */
.acts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:18px}
.act{text-align:start;border:2px solid var(--line);background:var(--paper);border-radius:20px;padding:16px;display:grid;gap:2px;align-content:start}
.act:hover{border-color:var(--ink)}
.act .ic{font-size:1.9rem;line-height:1.2}
.act b{font-family:var(--disp);font-size:1.15rem;color:var(--ink)}
.act small{color:var(--muted);font-weight:600}
.act.done{border-color:var(--ok)}
.act .st{font-weight:800;font-size:.85rem;color:var(--ok)}
h3.sec{font-size:1.15rem;margin:6px 0 10px}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0}
.gtop b{font-family:var(--disp);font-size:1.2rem;color:var(--ink)}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:10px;align-content:start}
.tile{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:10px;font-weight:800;min-height:56px;font-size:1.02rem;transition:opacity .25s}
.tile.en{direction:ltr}
.tile.sel{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 22%,var(--paper))}
.tile.gone{opacity:0;pointer-events:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.timer{font-family:var(--disp);font-weight:800;color:var(--ink);direction:ltr;font-size:1.2rem}

/* build */
.chipline{min-height:66px;border:2px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;direction:ltr;align-content:flex-start;margin-top:12px}
.chipline.good{border-color:var(--ok);background:var(--okbg)}
.bank{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;margin-top:12px;min-height:44px}
.wchip{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 12px;font-family:var(--disp);font-weight:700;font-size:1.05rem;box-shadow:0 3px 0 var(--line)}

/* scramble */
.slots{display:flex;gap:6px;direction:ltr;justify-content:center;flex-wrap:wrap;margin:18px 0}
.slot{width:42px;height:52px;border-bottom:4px solid var(--line);display:grid;place-items:center;font-family:var(--disp);font-size:1.6rem;font-weight:800;color:var(--ink)}
.slots.good .slot{border-color:var(--ok);color:var(--ok)}
.slots.bad .slot{border-color:var(--bad);color:var(--bad)}
.letters{display:flex;gap:8px;direction:ltr;justify-content:center;flex-wrap:wrap}
.letter{width:48px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-family:var(--disp);font-size:1.4rem;font-weight:800;box-shadow:0 3px 0 var(--line)}
.letter:disabled{opacity:.2}

/* dictation / speaking */
.diff{direction:ltr;text-align:left;font-family:var(--disp);font-size:1.2rem;line-height:2;margin:6px 0}
.w-ok{color:var(--ok);font-weight:800}
.w-bad{color:var(--bad);font-weight:800;text-decoration:underline wavy}
textarea.dict{width:100%;direction:ltr;text-align:left;font-family:var(--disp);font-size:1.2rem;border:2px solid var(--line);background:var(--paper2);border-radius:14px;padding:10px;min-height:84px;margin-top:14px}
.mics{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin:18px 0 6px}
.mics>div{text-align:center}
.mics small{display:block;color:var(--muted);font-weight:700;margin-top:6px}
.rec{width:84px;height:84px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-size:2rem;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.rec.dark{background:var(--ink);color:var(--bg)}
.rec.on{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
audio{width:100%;margin-top:8px}
.stars{font-size:2.4rem;letter-spacing:6px;color:var(--sun);margin-top:10px}
.stars .off{color:var(--line)}
.pct{font-family:var(--disp);font-weight:800;font-size:1.3rem}

/* ---- app shell with vertical sidebar ---- */
.side{position:fixed;top:0;bottom:0;right:0;width:240px;z-index:40;background:var(--paper);border-left:2px solid var(--line);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.side .brand{padding:4px 6px 14px;border-bottom:2px dashed var(--line)}
.nav{display:grid;gap:4px;margin-top:12px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:12px;padding:10px 12px;font-weight:800;color:var(--muted);text-align:start;line-height:1.3}
.nav button:hover{background:var(--paper2);color:var(--ink)}
.nav .ic{font-size:1.25rem;width:26px;text-align:center;flex:none}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav .badge{margin-inline-start:auto;font-size:.75rem;font-weight:800;background:var(--sun);color:#3a2a00;border-radius:99px;padding:0 8px}
.nav hr{margin:6px 0}
.me{margin-top:auto;padding:12px 8px 0;border-top:2px dashed var(--line);font-weight:700;font-size:.92rem;display:grid;gap:2px}
.me b{font-family:var(--disp);color:var(--ink);font-size:1.05rem}
.main{margin-right:240px;min-height:100vh}
.main>.airmail{position:sticky;top:0;z-index:5}
.actionbar{right:240px}
.focus .main{margin-right:0}
.focus .actionbar{right:0}
@media (max-width:760px){
 .side{width:72px;padding-inline:6px}
 .side .brand span,.nav .badge,.me{display:none}
 .side .brand{justify-content:center;padding-inline:0}
 .nav button{flex-direction:column;gap:2px;padding:8px 2px;font-size:.62rem;text-align:center}
 .nav .ic{width:auto}
 .main{margin-right:72px}
 .actionbar{right:72px}
 .wrap{padding:0 12px 120px}
}

/* ---- lesson with vertical steps ---- */
.lgrid{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start;margin-top:16px}
.lgrid>*{min-width:0}
.vsteps{position:sticky;top:18px;list-style:none;margin:0;padding:0;display:grid;gap:6px}
.vsteps button{width:100%;display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 10px;font-weight:800;font-size:.95rem;color:var(--muted);text-align:start}
.vsteps .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paper2);border:2px solid var(--line);font-family:var(--disp);font-size:.9rem}
.vsteps .done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.vsteps .now .n{background:var(--lv);border-color:var(--lv);color:#fff}
.vsteps [aria-current="step"]{border-color:var(--lv);color:var(--ink);background:color-mix(in srgb,var(--lv) 10%,var(--paper))}
.vsteps .lock{opacity:.5}
.vsteps .day{font-size:.75rem;color:var(--muted);font-weight:700;padding:6px 4px 0}
.stepbox{display:none}
@media (max-width:980px){
 .lgrid{grid-template-columns:1fr}
 .lgrid>.vsteps{display:none}
 .stepbox{display:block;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:6px 10px;margin-top:14px}
 .stepbox summary{cursor:pointer;font-weight:800;color:var(--ink);padding:6px 2px}
 .stepbox .vsteps{position:static;padding:4px 0 8px}
}

/* ---- video player ---- */
.video{border-radius:22px;overflow:hidden;border:2px solid var(--line);background:#0f1d30}
.screen{position:relative;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--lv) 55%,#fff),var(--lv) 55%,color-mix(in srgb,var(--lv) 55%,#000))}
.scene{font-size:clamp(3.2rem,12vw,7rem);line-height:1.1;text-align:center;filter:drop-shadow(0 10px 14px rgba(0,0,0,.28));animation:kb 7s ease-out both}
@keyframes kb{0%{transform:scale(.7) translateY(20px);opacity:0}12%{opacity:1;transform:scale(1)}100%{transform:scale(1.1) translateY(-6px)}}
.vt{color:#fff;text-align:center;font-family:var(--disp);padding:20px}
.vt b{display:block;font-size:clamp(1.4rem,4vw,2.2rem);direction:ltr}
.vt small{opacity:.85;font-weight:700}
.vsub{position:absolute;left:4%;right:4%;bottom:5%;text-align:center;direction:ltr;font-family:var(--disp);font-weight:700;font-size:clamp(.95rem,2.4vw,1.3rem);line-height:1.4;color:#fff;background:rgba(0,0,0,.6);border-radius:10px;padding:6px 12px}
.nosub .vsub{display:none}
.vbig{position:absolute;inset:0;border:0;background:rgba(0,0,0,.2);color:#fff;font-size:4rem;display:grid;place-items:center}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;flex-wrap:wrap}
.vbar button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;height:38px;min-width:38px;padding:0 10px;font-weight:800}
.vbar button[aria-pressed="true"]{background:var(--sun);color:#3a2a00}
.vprog{flex:1;min-width:80px;height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.vprog i{display:block;height:100%;width:0;background:var(--sun);transition:width .5s}
.vq{margin-top:16px}
.vq .opts{margin-top:10px}
.qblock{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.qblock .qt{font-weight:800;font-size:1.08rem}
.qblock .opts{gap:8px;margin-top:10px}
.qblock .opt{padding:10px 14px;font-size:1rem}
.opt.sel{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 10%,var(--paper))}
.vlib{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.vcard{border:2px solid var(--line);background:var(--paper);border-radius:16px;overflow:hidden;text-align:start;padding:0}
.vcard .th{aspect-ratio:16/9;display:grid;place-items:center;font-size:2.4rem;background:var(--lv)}
.vcard div{padding:8px 10px;font-weight:800;font-size:.9rem}
.vcard small{display:block;color:var(--muted);font-weight:700}

/* ---- schedule ---- */
.sched{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sched li{display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.sched .dn{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;background:var(--paper2);border:2px solid var(--line);color:var(--ink);line-height:1.1;text-align:center;font-size:.8rem}
.sched .dn b{font-size:1.2rem;display:block}
.sched .tx{flex:1;min-width:0}
.sched .tx b{display:block}
.sched .tx small{color:var(--muted);font-weight:700}
.sched .st{font-weight:800;font-size:.85rem;white-space:nowrap}
.sched li.done .dn{background:var(--ok);border-color:var(--ok);color:#fff}
.sched li.today{border-color:var(--lv);box-shadow:0 0 0 3px color-mix(in srgb,var(--lv) 30%,transparent)}
.sched li.today .dn{background:var(--lv);border-color:var(--lv);color:#fff}
.sched li.rest .dn{background:color-mix(in srgb,var(--sun) 30%,var(--paper))}
.sched li.big .dn{background:var(--coral);border-color:var(--coral);color:#fff}

/* ---- words ---- */
.wtools{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.wtools input{flex:1;min-width:180px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px}
.wlist{display:grid;gap:8px}
.wrow{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.wrow .say{margin:0;flex:none;width:36px;height:36px}
.wrow .w{flex:1;min-width:0}
.wrow .w b{font-family:var(--disp);font-size:1.12rem;color:var(--ink);direction:ltr;display:inline-block}
.wrow .w small{display:block;color:var(--muted);direction:ltr;text-align:left}
.wrow .m{font-weight:700;text-align:end}
.wgroup{margin:18px 0 8px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:8px}
.wgroup i{font-style:normal;color:#fff;background:var(--lv);border-radius:8px;padding:0 8px;font-family:var(--disp);direction:ltr}

/* ---- level exam ---- */
.passage{direction:ltr;text-align:left;font-family:var(--disp);font-size:1.12rem;line-height:1.9;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px}
.xsec{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.xsec span{font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted);background:var(--paper)}
.xsec span.on{background:var(--lv);border-color:var(--lv);color:#fff}
.xsec span.done{color:var(--ok);border-color:var(--ok)}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kw span{direction:ltr;font-family:var(--disp);font-weight:700;border:2px solid var(--line);border-radius:10px;padding:2px 10px;background:var(--paper2)}
.kw span.hit{border-color:var(--ok);background:var(--okbg)}
textarea.essay{width:100%;min-height:220px;direction:ltr;text-align:left;font-family:var(--disp);font-size:1.1rem;line-height:1.7;border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:14px}
.breakdown{display:grid;gap:8px;text-align:start;margin:16px 0}
.breakdown div{display:flex;justify-content:space-between;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px}
.pagehead{margin:18px 0 6px}
.pagehead h1{font-size:clamp(1.6rem,4vw,2.2rem)}
.pagehead p{color:var(--muted);margin-top:4px}
.s-exam .dot{background:var(--paper);border-color:var(--lv);border-style:dashed;font-size:1.6rem}
.s-exam.s-cur .dot{border-style:solid}
</style>
</head>

[["This is my brother.","هذا أخي."],["Her name is Mona.","اسمها منى."],["Our house is big.","بيتنا كبير."],["Omar's father is a doctor.","والد عمر طبيب."]]],

{t:"My day",a:"يومي والمضارع البسيط",
v:[["wake up","يستيقظ","I wake up at six."],["breakfast","فطور","We eat breakfast together."],["school","مدرسة","He goes to school by bus."],["always","دائمًا","She always smiles."],["usually","عادةً","I usually walk home."],["never","أبدًا","He never drinks coffee."],["homework","واجب منزلي","I do my homework after lunch."],["sleep","ينام","Cats sleep a lot."]],

[["She is determined to succeed.","هي مصممة على النجاح (مدح)."],["He's too stubborn to listen.","هو عنيد لدرجة أنه لا يستمع (ذم)."],["My grandfather is thrifty.","جدي مقتصد (مدح)."],["Don't be so nosy!","لا تكن متطفلًا هكذا!"]]],
q:[["Which word praises someone who never gives up?","determined",["stubborn","nosy","stingy"],"determined إيجابية."],["A negative word for someone who hates spending money:","stingy",["thrifty","generous","careful"],"stingy سلبية."],["A positive way to describe a thin person:","slim",["skinny","bony","scrawny"],"slim مدح."],["A child who asks many questions to learn is ___.","curious",["nosy","rude","stubborn"],"curious إيجابية."],["“Nosy” suggests someone is:","interested in others' private business",["very smart","hungry","generous"],"nosy = متطفل."],["Which pair has a similar meaning but opposite feeling?","thrifty / stingy",["happy / sad","big / small","hot / cold"],"كلاهما عن توفير المال، لكن الأولى مدح والثانية ذم."]]},

v:[["hypothetical","افتراضي","It's a hypothetical question."],["circumstance","ظرف","Under these circumstances..."],["alternative","بديل","Is there an alternative?"],["inevitable","حتمي","Change is inevitable."],["scenario","سيناريو","Imagine the worst scenario."],["suppose","لنفترض","Suppose you won a million."],["otherwise","وإلا","Hurry, otherwise we'll be late."],["provided that","بشرط أن","You can go provided that you call."]],
g:["Mixed conditionals & hypothetical language","الشرط المختلط يربط الماضي بالحاضر: If I <b>had studied</b> medicine, I <b>would be</b> a doctor now.<br>أو يربط صفة دائمة بنتيجة ماضية: If I <b>were</b> braver, I <b>would have spoken</b>.<br>عبارات افتراضية: <b>Suppose</b>...، <b>It's high time</b> we left (+ ماضٍ)، <b>I'd rather</b> you didn't...، <b>provided that</b> = بشرط.",
[["If I had saved money, I would be rich now.","لو ادخرت المال لكنت غنيًا الآن."],["If she weren't so shy, she would have joined.","لو لم تكن خجولة لانضمت."],["It's high time we started.","حان الوقت لنبدأ."],["I'd rather you stayed.","أفضّل أن تبقى."]]],
q:[["If I had taken the job, I ___ in London now.","would be living",["would have lived","will live","lived"],"ماضٍ ← نتيجة في الحاضر."],["If he ___ so lazy, he would have finished.","weren't",["hadn't","isn't","wasn't being"],"صفة دائمة ← نتيجة ماضية."],["It's high time we ___ home.","went",["go","will go","have gone"],"It's high time + ماضٍ بسيط."],["I'd rather you ___ tell anyone.","didn't",["don't","won't","not"],"I'd rather + فاعل + ماضٍ."],["You can come, ___ you are quiet.","provided that",["unless","otherwise","whereas"],"provided that = بشرط."],["Certain to happen; unavoidable:","inevitable",["hypothetical","alternative","scenario"],"inevitable = حتمي."]]},

g:["Hedging & persuasive writing","الكاتب المتمكن يخفف حدة ادعاءاته ليكون دقيقًا (hedging): <b>It could be argued that</b>... · <b>This tends to</b>... · <b>Arguably</b>... · <b>It seems likely that</b>...<br>وللإقناع: اعترف بالرأي المخالف ثم فنّده (<b>While some claim</b>..., the evidence suggests...)، واستخدم الأسئلة البلاغية والثلاثيات.",
[["It could be argued that homework is essential.","يمكن القول إن الواجبات ضرورية."],["Students tend to learn better with games.","يميل الطلاب إلى التعلم أفضل بالألعاب."],["While some disagree, the evidence is compelling.","رغم اعتراض البعض فإن الأدلة مقنعة."],["This may undermine public trust.","قد يقوّض هذا ثقة الناس."]]],
q:[["Which sentence is hedged?","This may suggest a link.",["This proves everything.","This is 100% true.","Everyone knows this."],"may تخفف الادعاء."],["“Compelling evidence” is evidence that is:","convincing",["weak","secret","old"],"compelling = مقنع."],["To admit an opposing view is to ___ it.","acknowledge",["undermine","persuade","ignore"],"acknowledge = يعترف بـ."],["___, this is the best novel of the decade.","Arguably",["Undermine","Tend","Compelling"],"Arguably = يمكن القول."],["Choose the persuasive structure:","While some claim X, the evidence shows Y.",["X. Y. Z.","I think maybe no.","X is X."],"الاعتراف بالرأي المخالف ثم تفنيده."],["People ___ trust experts more than strangers.","tend to",["tend","tending","tends to"],"people جمع: tend to."]]}
];

const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
function diffWords(target,input){const T=target.split(/\s+/),tn=T.map(norm),u=norm(input).split(" ").filter(Boolean);
 const m=tn.length,n=u.length,dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
 for(let a=m-1;a>=0;a--)for(let b=n-1;b>=0;b--)dp[a][b]=tn[a]===u[b]?dp[a+1][b+1]+1:Math.max(dp[a+1][b],dp[a][b+1]);
 const ok=new Array(m).fill(false);let a=0,b=0;while(a<m&&b<n){if(tn[a]===u[b]){ok[a]=true;a++;b++}else if(dp[a+1][b]>=dp[a][b+1])a++;else b++}
 const hit=ok.filter(Boolean).length,extra=Math.max(0,n-hit);const pct=Math.round(Math.max(0,hit-extra*.5)/m*100);
 return{pct,html:T.map((w,k)=>`<span class="${ok[k]?"w-ok":"w-bad"}">${esc(w)}</span>`).join(" ")}}

function mcq(tag,prompt,correct,wrongs,why,extra){return Object.assign({t:"mcq",tag,prompt,opts:shuffle([correct,...wrongs]),ans:correct,why},extra||{})}

const vReverse=(w,l)=>mcq("من العربية للإنجليزية",`كيف تقول «${w[1]}» بالإنجليزية؟`,w[0],pick(others(l,w,0),3),`«${w[1]}» = <span class="en">${w[0]}</span><br><span class="en">${w[2]}</span>`,{sayAfter:w[0]});
const vListen=(w,l)=>TTS?mcq("استماع","استمع جيدًا واختر ما سمعته",w[0],pick(others(l,w,0),3),`سمعت: <span class="en">${w[0]}</span> (${w[1]})`,{listen:w[0]}):vMeaning(w,l);
const vSpell=w=>({t:"spell",tag:"إملاء",prompt:`اكتب بالإنجليزية: «${w[1]}»`,ans:w[0],why:`الكتابة الصحيحة: <span class="en">${w[0]}</span><br><span class="en">${w[2]}</span>`,sayAfter:w[0]});
const gq=(q,tag)=>mcq(tag||"قواعد",`<span class="qtext en">${esc(q[0]).replace(/___/g,'<span class="blank"></span>')}</span>`,q[1],q[2],q[3]);
function buildQuiz(i){const l=L[i],v=shuffle(l.v);return [vMeaning(v[0],l),gq(l.q[0]),vListen(v[1],l),vMeaning(v[2],l),gq(l.q[1]),vReverse(v[3],l),gq(l.q[2]),vMeaning(v[4],l)]}

 const qs=[vReverse(v[0],l),gq(l.q[3]),vListen(v[1],l),vSpell(v[2]),gq(l.q[4]),vReverse(v[3],l),vListen(v[4],l),gq(l.q[5]),vSpell(v[5]),vMeaning(v[6],l),gq(l.q[Math.floor(Math.random()*3)])];

 XS={r,sec:0,pts:[0,0,0,0,0],ans:{},plays:0,R:e.R[1].map(mq),H:e.H[1].map(mq),G:shuffle(G),SP:pick(ws.filter(w=>/^[a-z]{3,12}$/i.test(w[0])),2),wrong:[],W:null};touch();xRender()}
function xHead(){const lv=LV[XS.r];return `<div class="tbar"><b>امتحان المستوى <span class="en">${lv.c}</span></b></div><div class="xsec">${XSEC.map((t,k)=>`<span class="${k<XS.sec?"done":k===XS.sec?"on":""}">${k<XS.sec?"✓ ":""}${t}</span>`).join("")}</div>`}
function qList(key){return XS[key].map((q,j)=>`<div class="qblock"><div class="qt ${isAr(q.prompt)?"":"en"}" style="${isAr(q.prompt)?"":"text-align:left"}">${j+1}. ${q.prompt}</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt ${isAr(o)?"":"en-opt"} ${XS.ans[key+j]===k?"sel":""}" data-g="${key}${j}" onclick="xSel('${key}',${j},${k},this)">${esc(o)}</button>`).join("")}</div></div>`).join("")}
function xSel(key,j,k,b){XS.ans[key+j]=k;document.querySelectorAll(`[data-g="${key}${j}"]`).forEach(x=>x.classList.toggle("sel",x===b))}
function xRender(){const e=LX[XS.r],lv=LV[XS.r];let body="";
 if(XS.sec===0)body=`<p class="hint">اقرأ النص بعناية ثم أجب. (٥ درجات لكل سؤال)</p><div class="passage">${esc(e.R[0])}</div><h3 class="sec" style="margin-top:16px">الأسئلة</h3>${qList("R")}`;
 if(XS.sec===1)body=`<p class="hint">ستسمع نصًا بدون كتابة. يمكنك التشغيل 3 مرات فقط. (٥ درجات لكل سؤال)</p><div class="bigsay"><button id="hplay" onclick="xPlay()" aria-label="تشغيل">🔊</button></div><p style="text-align:center;font-weight:800" id="hleft">مرات التشغيل المتبقية: ${3-XS.plays}</p><h3 class="sec">الأسئلة</h3>${qList("H")}`;
 if(XS.sec===2)body=`<p class="hint">أسئلة من الدروس الستة. (٣ درجات لكل سؤال)</p>${XS.G.map((q,j)=>`<div class="qblock"><div class="qt">${j+1}. ${q.prompt}</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt ${isAr(o)?"":"en-opt"} ${XS.ans["G"+j]===k?"sel":""}" data-g="G${j}" onclick="xSel('G',${j},${k},this)">${esc(o)}</button>`).join("")}</div></div>`).join("")}`;
 if(XS.sec===3)body=`<p class="hint">استمع لكل كلمة واكتبها بالإنجليزية. (٥ درجات لكل كلمة)</p>${XS.SP.map((w,j)=>`<div class="qblock"><div class="row"><button class="ibtn" data-say="${esc(w[0])}">🔊 الكلمة ${j+1}</button><button class="ibtn" data-say="${esc(w[0])}" data-slow="1">🐢</button></div><div class="spell"><input id="xs${j}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="الكلمة ${j+1}"></div></div>`).join("")}`;
 if(XS.sec===4)body=`<div class="info"><b>${esc(e.W[0])}</b><p class="en" style="text-align:left;margin-top:6px">${esc(e.W[1])} (at least ${e.W[2]} words)</p><p style="margin-top:8px">استخدم هذه الكلمات أو التراكيب:</p><div class="kw" id="kw">${e.W[3].map(k=>`<span>${esc(k)}</span>`).join("")}</div></div>
 <textarea class="essay" id="essay" oninput="xCount()" aria-label="اكتب هنا" placeholder="Write here..."></textarea><p id="wcount" style="font-weight:800;margin-top:6px">0 / ${e.W[2]} كلمة</p>`;
 view(`<div class="wrap test" style="--lv:${lv.col}">${xHead()}<h2 style="margin:6px 0 10px">${["📖","🎧","📐","✍️","📝"][XS.sec]} ${XSEC[XS.sec]}</h2>${body}<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn sun" onclick="xSubmit()">${XS.sec<4?"سلّم القسم وانتقل للتالي":"سلّم الامتحان"}</button></div></div>`,"focus")}
function xPlay(){if(XS.plays>=3)return toast("انتهت مرات التشغيل");XS.plays++;$("#hleft").textContent="مرات التشغيل المتبقية: "+(3-XS.plays);say(LX[XS.r].H[0],{rate:(S.rate||.9)<.8?.7:.88})}
function xCount(){const e=LX[XS.r],t=$("#essay").value,n=wc(t),low=" "+norm(t)+" ";$("#wcount").textContent=`${n} / ${e.W[2]} كلمة`;
 document.querySelectorAll("#kw span").forEach((s,j)=>s.classList.toggle("hit",low.includes(" "+norm(e.W[3][j])+" ")))}
function xGrade(key,w){let p=0;XS[key].forEach((q,j)=>{const k=XS.ans[key+j];if(q.opts[k]===q.ans)p+=w;else XS.wrong.push(q)});return p}
function xSubmit(){const sec=XS.sec,key=["R","H","G"][sec];
 if(key&&XS[key].some((_,j)=>XS.ans[key+j]==null))return toast("أجب عن كل الأسئلة أولًا");
 if(sec===0)XS.pts[0]=xGrade("R",5);
 if(sec===1){if(!XS.plays)return toast("استمع للنص أولًا");XS.pts[1]=xGrade("H",5)}
 if(sec===2)XS.pts[2]=xGrade("G",3);
 if(sec===3){let p=0;XS.SP.forEach((w,j)=>{const v=norm($("#xs"+j).value),a=norm(w[0]);if(v===a)p+=5;else if(a.length>=5&&lev(v,a)===1)p+=3;if(v!==a)XS.wrong.push({prompt:`إملاء: ${w[1]}`,ans:w[0]})});XS.pts[3]=p}
 if(sec===4){const e=LX[XS.r],t=$("#essay").value,n=wc(t);if(n<5)return toast("اكتب نصك أولًا");
  if(n<e.W[2]&&!confirm(`كتبت ${n} كلمة من ${e.W[2]} المطلوبة. هل تريد التسليم؟`))return;
  const low=" "+norm(t)+" ",hits=e.W[3].filter(k=>low.includes(" "+norm(k)+" "));const len=n>=e.W[2]?10:n>=e.W[2]*.6?6:2;
  XS.pts[4]=Math.round(len+hits.length*2.5);XS.W={text:t,n,hits,len};return xFinish()}
 XS.sec++;xRender()}
function xFinish(){const r=XS.r,lv=LV[r],x=S.X[r]||(S.X[r]={}),total=XS.pts.reduce((a,b)=>a+b,0),ok=total>=70;
 x.tries=(x.tries||[]).concat([{d:today(),s:total}]);logMistakes(r*LN,XS.wrong);
 if(ok){x.passed=today();x.score=total;S.xp+=200}else x.failed=today();save();
 const e=LX[r],W=XS.W;
 view(`<div class="wrap result" style="--lv:${lv.col}">
 ${ok?`<div class="bigstamp" aria-hidden="true"><span><b class="en" style="font-size:1.6rem">${lv.c}</b><small>امتحان المستوى</small><small>${total}٪</small></span></div>`:`<div class="score"><svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="80" fill="none" stroke="var(--line)" stroke-width="16"/><circle cx="95" cy="95" r="80" fill="none" stroke="var(--coral)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${2*Math.PI*80}" stroke-dashoffset="${2*Math.PI*80*(1-total/100)}"/></svg><b class="en">${total}</b></div>`}
 <h2>${ok?`نجحت في امتحان المستوى ${lv.c}!`:"لم تصل لدرجة النجاح هذه المرة"}</h2>
 <p>${ok?(r<NL-1?`المستوى ${r+2} (${LV[r+1].n}) يُفتح غدًا.`:"أتممت الرحلة كاملة!"):"تحتاج 70 من 100. راجع كلمات المستوى وأخطاءك، ويمكنك إعادة الامتحان غدًا."}</p>
 <div class="breakdown">${XSEC.map((t,k)=>`<div><span>${t}</span><span class="en">${XS.pts[k]} / ${XMAX[k]}</span></div>`).join("")}<div style="border-color:var(--lv)"><span>المجموع</span><span class="en">${total} / 100</span></div></div>
 <div class="info" style="text-align:start"><b>تقييم الكتابة</b><p>عدد الكلمات: ${W.n} من ${e.W[2]} (${W.len} من 10). الكلمات المطلوبة المستخدمة: ${W.hits.length} من ${e.W[3].length}${W.hits.length?`: <span class="en">${W.hits.map(esc).join(", ")}</span>`:""}.</p>${AI?`<button class="btn ghost" style="margin-top:10px" id="aiw" onclick="aiWriting()">💬 ملاحظات المعلم الذكي على كتابتي</button><div id="aiwo" class="msg ai" style="margin-top:10px;display:none"></div>`:""}</div>
 <div class="row" style="justify-content:center;margin-top:16px">${ok?`<button class="btn sun" onclick="cert(${r})">🎓 استلم الشهادة</button>`:`<button class="btn sun" onclick="wordFilter.lv='${r}';pgWords()">📚 راجع كلمات المستوى</button>`}<button class="btn ghost" onclick="home()">الرئيسية</button></div>
 ${XS.wrong.length?`<div class="wrongs"><h3>أخطاؤك في الامتحان</h3>${XS.wrong.map(q=>`<div class="wi"><div>${q.prompt}</div><div>الصحيح: <span class="ans ${isAr(q.ans)?"":"en"}">${esc(q.ans)}</span></div></div>`).join("")}</div>`:""}</div>`,"focus");
 if(ok)confetti(180)}
async function aiWriting(){if(!AI||!XS||!XS.W)return;const o=$("#aiwo"),b=$("#aiw");o.style.display="block";o.textContent="يقرأ المعلم كتابتك...";b.disabled=true;const e=LX[XS.r];
 try{const r=await AI(`أنت معلم إنجليزي لطالب عربي في المستوى ${LV[XS.r].c}. المهمة: ${e.W[0]}\nنص الطالب:\n${XS.W.text}\n\nأعطه ملاحظات بالعربية باختصار (أقل من 150 كلمة): نقطتان قويتان، وأهم 3 أخطاء مع تصحيحها بالإنجليزية، ونصيحة واحدة. بدون ماركداون.`,{onText:({text})=>{o.textContent=text},cache:false});o.textContent=r.text}
 catch(err){o.textContent="تعذّر الحصول على الملاحظات الآن."}}

/* ---------- confetti ---------- */
function confetti(N){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const cols=LV.map(l=>l.col).concat(["#FFC23C"]);const ps=Array.from({length:N},()=>({x:c.width/2,y:c.height*.35,vx:(Math.random()-.5)*14,vy:Math.random()*-13-3,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
 let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++t<140)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

/* ---------- certificate ---------- */
function cert(r){const lv=LV[r],x=S.X[r]||{};if(!x.passed)return toast("الشهادة تُمنح بعد اجتياز امتحان المستوى");
 const m=document.createElement("div");m.className="modal";m.innerHTML=`<div style="display:grid;gap:14px;justify-items:center;width:100%"><div class="cert" style="--lv:${lv.col}">
 <div class="lvc">${lv.c}</div><h2>شهادة إتمام المستوى ${r+1}: ${lv.n}</h2><p>تُمنح هذه الشهادة إلى</p><div class="nm">${esc(S.name)}</div>
 <p>لإتمامه ستة دروس واجتياز امتحان المستوى (قراءة، استماع، قواعد، إملاء، كتابة) بنتيجة <b class="en">${x.score}%</b>.<br>${lv.d}.</p><p style="margin-top:12px"><b>التاريخ:</b> <span class="en">${x.passed}</span></p></div>
 <div class="row"><button class="btn sun" onclick="print()">اطبع الشهادة</button><button class="btn ghost" style="background:var(--paper)" onclick="this.closest('.modal').remove()">إغلاق</button></div></div>`;
 m.addEventListener("click",e=>{if(e.target===m)m.remove()});document.body.appendChild(m)}

/* ---------- mistakes ---------- */
function showMistakes(){const list=S.mist.slice().reverse();
 view(page("دفتر أخطائي","كل خطأ هنا فرصة. راجعها قبل امتحان المراجعة وامتحان المستوى.",list.length?`<div class="wrongs" style="margin-top:0">${list.map(m=>`<div class="wi"><small class="muted">المستوى ${lvOf(m.i).c}، الدرس ${m.i%LN+1}، ${shortDate(m.d)}</small><div>${esc(m.p)}</div><div>الصحيح: <span class="ans ${isAr(m.a)?"":"en"}">${esc(m.a)}</span> ${isAr(m.a)?"":sayBtn(m.a)}</div></div>`).join("")}</div>
 <button class="btn ghost" onclick="if(confirm('مسح كل الأخطاء من الدفتر؟')){S.mist=[];save();showMistakes()}">امسح الدفتر</button>`:`<div class="empty card">الدفتر فارغ. الأخطاء التي تقع فيها في الاختبارات ستظهر هنا.</div>`),"mist")}

/* ---------- settings ---------- */
function settings(){const m=document.createElement("div");m.className="modal";
 const code=()=>{try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return""}};
 m.innerHTML=`<div class="sheet" role="dialog" aria-label="الإعدادات"><h2>الإعدادات</h2>
 <div class="field"><label for="sn"><b>اسم المسافر</b></label><input id="sn" value="${esc(S.name)}" maxlength="30"></div>
 <div class="field"><b>المظهر</b><div class="seg">${[["auto","تلقائي"],["light","فاتح"],["dark","داكن"]].map(([k,t])=>`<button aria-pressed="${S.theme===k}" data-th="${k}">${t}</button>`).join("")}</div></div>
 <div class="field"><b>اختبار الصوت</b><div class="row"><button class="ibtn" data-say="Hello! Your sound is working.">🔊 جرّب الصوت</button><small class="muted">لو لم تسمع شيئًا: ارفع الصوت، ألغِ الوضع الصامت، أو افتح الصفحة في Chrome أو Safari.</small></div></div>
 <hr><h3 style="font-size:1.1rem">وضع ولي الأمر</h3>
 <label class="check"><input type="checkbox" id="sk" ${S.skip?"checked":""}><span>تجاوز انتظار الأيام (أيام الراحة وانتظار اليوم التالي). ترتيب الخطوات يبقى كما هو.</span></label>
 <hr><h3 style="font-size:1.1rem">نقل التقدّم لجهاز آخر</h3><p class="muted" style="font-size:.92rem">التقدم محفوظ في هذا المتصفح. انسخ الرمز والصقه في الجهاز الآخر.</p>
 <div class="field"><textarea id="pc" rows="3" dir="ltr" aria-label="رمز التقدم"></textarea></div>
 <div class="row"><button class="btn ghost" id="cp">انسخ رمز تقدّمي</button><button class="btn ghost" id="im">استورد الرمز</button></div>
 <hr><div class="row" style="justify-content:space-between"><button class="btn ghost" id="rs" style="color:var(--bad)">ابدأ الرحلة من جديد</button><button class="btn" id="sv">حفظ</button></div></div>`;
 document.body.appendChild(m);m.addEventListener("click",e=>{if(e.target===m)m.remove()});
 m.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;applyTheme();save();m.querySelectorAll("[data-th]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
 m.querySelector("#cp").onclick=async()=>{const c=code();m.querySelector("#pc").value=c;try{await navigator.clipboard.writeText(c);toast("نُسخ الرمز")}catch(e){m.querySelector("#pc").select();toast("الرمز جاهز في المربع، انسخه يدويًا")}};
 m.querySelector("#im").onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob(m.querySelector("#pc").value.trim()))));if(!o||typeof o!=="object"||!o.L)throw 0;S=Object.assign(def(),o);save();applyTheme();m.remove();toast("تم استيراد التقدّم");home()}catch(e){toast("الرمز غير صالح. تأكد من نسخه كاملًا")}};
 m.querySelector("#rs").onclick=()=>{if(confirm("سيُحذف كل التقدم والأختام. متأكد؟")){S=def();save();applyTheme();m.remove();welcome()}};
 m.querySelector("#sv").onclick=()=>{const n=m.querySelector("#sn").value.trim();if(n)S.name=n;S.skip=m.querySelector("#sk").checked;save();m.remove();toast("تم الحفظ");if(route!=="focus")home()}}

home();

</script>
